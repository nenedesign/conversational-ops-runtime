[project]
name = "cor"
version = "0.1.0-phase1"
requires-python = ">=3.12"
description = "Conversational Operations Runtime — Phase 1 reference implementation"
# Dependencies are intentionally omitted here.
# Use `make install` — it installs from requirements.txt with SHA-256 hash
# verification and CVE scanning. Running `pip install .` directly bypasses
# both checks and is not supported.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "adapters*"]
