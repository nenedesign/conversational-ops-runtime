services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cor_dev
      POSTGRES_USER: cor
      POSTGRES_PASSWORD: cor_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cor -d cor_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
